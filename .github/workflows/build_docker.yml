name: Build and Deploy Docker Image

# Publishes the web dashboard image to Docker Hub and to GitHub Container Registry.
#
# Setup (repository Settings › Secrets and variables › Actions):
#   - variable DOCKERHUB_USERNAME: the Docker Hub account to publish to
#   - secret   DOCKERHUB_TOKEN:    a Docker Hub access token with read & write access
# The image is published as <DOCKERHUB_USERNAME>/typesense-dashboard and
# ghcr.io/<owner>/typesense-dashboard, tagged `main` for the main branch and
# `x.y.z`, `x.y` and `latest` for version tags such as v2.5.0.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret in the repository's Actions settings."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Registry image names must be lowercase.
      - name: Image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          echo "dockerhub=$(lower "$DOCKERHUB_USERNAME")/typesense-dashboard" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/$(lower "$OWNER")/typesense-dashboard" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.names.outputs.dockerhub }}
            ${{ steps.names.outputs.ghcr }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
